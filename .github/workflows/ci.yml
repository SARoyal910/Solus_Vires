name: CI

on:
  push:
    branches: [main, dev, phase2]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: solusvires_test
          POSTGRES_USER: solusvires
          POSTGRES_PASSWORD: test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U solusvires -d solusvires_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://solusvires:test-only@localhost:5432/solusvires_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  web:
    # Browser-side notes encryption, run under Node's WebCrypto.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test tests/web/

  headers:
    # Brings up the real nginx + api + db stack with a self-signed cert and
    # checks every page for the security headers.
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only
      CHECKIN_TOKEN_SECRET: ci-only
    steps:
      - uses: actions/checkout@v4
      - name: Self-signed cert in place of the Cloudflare origin cert
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost" \
            -keyout certs/origin.key -out certs/origin.crt
      - name: Skip the Cloudflare client-certificate check (CI isn't Cloudflare)
        run: sed -i '/authenticated-origin-pulls.conf/d' nginx/conf.d/default.conf
      - run: docker compose up -d --build --wait
      - run: PROBE_INSECURE=1 scripts/probe_headers.sh https://localhost
      - if: failure()
        run: docker compose logs
