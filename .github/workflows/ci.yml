name: CI

on:
  push:
    branches: [main, dev, phase2]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: solusvires_test
          POSTGRES_USER: solusvires
          POSTGRES_PASSWORD: test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U solusvires -d solusvires_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://solusvires:test-only@localhost:5432/solusvires_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  web:
    # Browser-side notes encryption, run under Node's WebCrypto.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: node --test tests/web/

  headers:
    # Brings up the real nginx + api + db stack with a self-signed cert the
    # way a deploy does (build, migrate, up --wait), checks that skipping the
    # migrate step fails loudly, then runs the header probe and the smoke test.
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only
      CHECKIN_TOKEN_SECRET: ci-only
      RECOVERY_CODE_PEPPER: ci-only
      # The click-through below registers throwaway accounts on this stack.
      BETA_SIGNUPS_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - name: Self-signed cert in place of the Cloudflare origin cert
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost" \
            -keyout certs/origin.key -out certs/origin.crt
      - name: Skip the Cloudflare client-certificate check (CI isn't Cloudflare)
        run: sed -i '/authenticated-origin-pulls.conf/d' nginx/conf.d/default.conf
      - run: docker compose build
      - name: Without migrations the api must not come up healthy (P2-A15)
        run: |
          if docker compose up -d --wait --wait-timeout 150; then
            echo "the api reported healthy on an unmigrated database"; exit 1
          fi
          docker compose ps
      - run: scripts/migrate.sh
      - run: docker compose up -d --wait --wait-timeout 120
      - name: Production config has no source bind mount
        run: "! docker compose config | grep -q 'target: /backend/app$'"
      - run: PROBE_INSECURE=1 scripts/probe_headers.sh https://localhost
      - name: Post-deploy smoke test, as run after every deploy
        run: PROBE_INSECURE=1 scripts/smoke.sh https://localhost
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm install --no-save --no-package-lock --prefix tests/browser puppeteer-core@23
      - name: Click through every page under the real policy; any CSP violation fails (P2-A4)
        run: node tests/browser/csp_clickthrough.mjs
        env:
          SV_NGINX_URL: https://localhost
          SV_API_CONTAINER: solusvires_api
          CHROME: /usr/bin/google-chrome
      - name: Header, Quick Exit and plain view under nginx, including the no-JavaScript /plain/ pages (P2-E1, E4)
        run: node tests/browser/site_ui.mjs
        env:
          PREVIEW_URL: https://localhost
          SV_NGINX_URL: https://localhost
          CHROME: /usr/bin/google-chrome
      - if: failure()
        run: docker compose logs

  scripts:
    # Lint the deploy, backup and test scripts (warnings and errors only).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -S warning scripts/*.sh

  browser:
    # Headless Chrome against the local preview: the offline copy (P2-E9),
    # the Notes PIN flows, export, safety plan and photos (P2-A3, A10, E3,
    # E7, E8), and the header, Quick Exit and plain view (P2-E1, E2, E4).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: scripts/preview.sh
      - run: npm install --no-save --no-package-lock --prefix tests/browser puppeteer-core@23
      - run: node tests/browser/offline.mjs
        env:
          CHROME: /usr/bin/google-chrome
      - run: node tests/browser/notes_pin.mjs
        env:
          CHROME: /usr/bin/google-chrome
      - run: node tests/browser/notes_vault.mjs
        env:
          CHROME: /usr/bin/google-chrome
      - run: node tests/browser/site_ui.mjs
        env:
          CHROME: /usr/bin/google-chrome
      - if: failure()
        run: docker compose -p solusvires-preview -f docker-compose.test.yml logs preview
