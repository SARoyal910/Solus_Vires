x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Shared by the api and the alert-worker: same image, same database, same
# secrets. Defined once so the two can never drift apart.
x-api-environment: &api-environment
  - PYTHONUNBUFFERED=1
  - APP_ENV=production
  - SITE_DIR=/usr/share/nginx/html
  - DATABASE_URL=postgresql+psycopg://solusvires:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}@db:5432/solusvires
  - SESSION_COOKIE_SECURE=true
  # nginx sets X-Real-IP to the real visitor; safe to trust behind it only.
  - TRUST_PROXY_HEADERS=true
  # Sign-ups stay invite-only until legal + advocacy review (PHASE2_PLAN D1).
  - BETA_SIGNUPS_ENABLED=${BETA_SIGNUPS_ENABLED:-false}
  - BETA_INVITE_CODES=${BETA_INVITE_CODES:-}
  - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://127.0.0.1:8000}
  - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
  - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
  - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@example.com}
  - CHECKIN_TOKEN_SECRET=${CHECKIN_TOKEN_SECRET:-}
  # Key for recovery-code HMACs. Required: set it once in .env and never
  # change it, or every recovery code already issued stops working.
  - RECOVERY_CODE_PEPPER=${RECOVERY_CODE_PEPPER:?Set RECOVERY_CODE_PEPPER}
  - BREVO_API_KEY=${BREVO_API_KEY:-}
  - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL:-no-reply@example.com}
  - BREVO_SENDER_NAME=${BREVO_SENDER_NAME:-Solus Vires}
  # Second email provider, tried when Brevo errors or is out of quota
  # (SCALE.md Stage 1 item 2). Empty = Brevo only. The sender must be
  # verified in Postmark; it defaults to BREVO_SENDER_EMAIL.
  - POSTMARK_SERVER_TOKEN=${POSTMARK_SERVER_TOKEN:-}
  - POSTMARK_SENDER_EMAIL=${POSTMARK_SENDER_EMAIL:-}
  - CHECKIN_ALERT_CHECK_SECONDS=${CHECKIN_ALERT_CHECK_SECONDS:-300}
  # Survivor's message to contacts, encrypted at rest (P3-I2). Empty = off.
  - CONTACT_NOTE_KEY=${CONTACT_NOTE_KEY:-}
  - INVITE_EMAILS_PER_DAY=${INVITE_EMAILS_PER_DAY:-10}
  - CHECKIN_ALERT_REPEAT_HOURS=${CHECKIN_ALERT_REPEAT_HOURS:-6}
  # The alert loop lives in the alert-worker container (SCALE.md Stage 1
  # item 5). Leave this off on the api unless the worker is down; running
  # both is harmless (advisory lock) but pointless.
  - CHECKIN_ALERT_LOOP_ENABLED=${CHECKIN_ALERT_LOOP_ENABLED:-false}
  # Contact form (D3): messages are emailed here through Brevo, never
  # stored. Empty = the form is off and says so.
  - CONTACT_INBOX_EMAIL=${CONTACT_INBOX_EMAIL:-}
  - CONTACT_RESPONSE_DAYS=${CONTACT_RESPONSE_DAYS:-7}
  # One email (never containing the IP) when one address is refused by the
  # rate limits ABUSE_ALERT_THRESHOLD times in an hour. Empty = off.
  - OPERATOR_ALERT_EMAIL=${OPERATOR_ALERT_EMAIL:-}
  - ABUSE_ALERT_THRESHOLD=${ABUSE_ALERT_THRESHOLD:-50}
  # Optional heartbeat (P2-F2): pinged after each alert pass, so a stopped
  # alert loop pages someone. Empty = no ping. docs/RUNBOOK.md "Monitoring".
  - HEALTHCHECK_PING_URL=${HEALTHCHECK_PING_URL:-}

services:
  web:
    logging: *default-logging
    image: nginx:alpine
    container_name: solusvires_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./certs:/etc/ssl/solusvires:ro
    depends_on:
      - api

  api:
    logging: *default-logging
    build: ./backend
    container_name: solusvires_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *api-environment
    expose:
      - "8000"
    # Production runs the code baked into the image: no source bind mount
    # (engineering review M8). For live-reload development, copy
    # docker-compose.override.example.yml to docker-compose.override.yml
    # (gitignored, so it can never reach the droplet).
    #
    # Healthy only when the API answers AND the database schema is exactly
    # the one this image's migrations expect. Migrations are not run on start;
    # a deploy that skips scripts/migrate.sh shows up as "unhealthy" here and
    # makes `docker compose up -d --wait` fail, instead of quietly running new
    # code against an old schema. The reason is in `docker inspect
    # --format '{{json .State.Health}}' solusvires_api`.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import os, sys, urllib.request
          from alembic.config import Config
          from alembic.runtime.migration import MigrationContext
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine
          urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=5)
          expected = set(ScriptDirectory.from_config(Config("alembic.ini")).get_heads())
          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as conn:
              current = set(MigrationContext.configure(conn).get_current_heads())
          engine.dispose()
          if current != expected:
              sys.exit(f"database schema is {sorted(current) or 'empty'}, this code needs {sorted(expected)}: run scripts/migrate.sh")
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
      start_interval: 2s

  # The check-in alert loop, on its own (SCALE.md Stage 1 item 5): a web
  # deploy, a slow login or an api crash never pauses alerts. Same image as
  # the api, different command. Healthy while the heartbeat file it touches
  # after every pass is younger than three check intervals.
  alert-worker:
    logging: *default-logging
    build: ./backend
    container_name: solusvires_alert_worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *api-environment
    command: ["python", "-m", "app.alert_worker"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import os, sys, time
          from alembic.config import Config
          from alembic.runtime.migration import MigrationContext
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine
          path = os.environ.get("ALERT_WORKER_HEARTBEAT_FILE", "/tmp/alert-worker-heartbeat")
          limit = 3 * int(os.environ.get("CHECKIN_ALERT_CHECK_SECONDS", "300"))
          try:
              age = time.time() - os.stat(path).st_mtime
          except FileNotFoundError:
              sys.exit("alert worker has not started a loop yet")
          if age > limit:
              sys.exit(f"last alert pass was {int(age)}s ago, more than {limit}s: the loop is stuck")
          # Same schema rule as the api: never run alerts against a schema
          # this code does not expect (a deploy that skipped scripts/migrate.sh).
          expected = set(ScriptDirectory.from_config(Config("alembic.ini")).get_heads())
          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as conn:
              current = set(MigrationContext.configure(conn).get_current_heads())
          engine.dispose()
          if current != expected:
              sys.exit(f"database schema is {sorted(current) or 'empty'}, this code needs {sorted(expected)}: run scripts/migrate.sh")
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 2s

  db:
    logging: *default-logging
    image: postgres:16-alpine
    container_name: solusvires_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=solusvires
      - POSTGRES_USER=solusvires
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solusvires -d solusvires"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
      start_interval: 1s
    expose:
      - "5432"
    ports:
      # Loopback-only, on a non-default port so it never collides with a
      # locally-installed Postgres and is never reachable off this machine
      # even if this compose file is run on a public host. Lets a local
      # (non-Docker) `uvicorn` dev server share this exact database instead
      # of silently talking to a different, unmigrated Postgres on :5432.
      - "127.0.0.1:5433:5432"

volumes:
  db_data:
