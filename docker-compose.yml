services:
  web:
    image: nginx:alpine
    container_name: solusvires_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./certs:/etc/ssl/solusvires:ro
    depends_on:
      - api

  api:
    build: ./backend
    container_name: solusvires_api
    restart: unless-stopped
    depends_on:
      - db
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=production
      - SITE_DIR=/usr/share/nginx/html
      - DATABASE_URL=postgresql+psycopg://solusvires:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}@db:5432/solusvires
      - SESSION_COOKIE_SECURE=true
      # nginx sets X-Real-IP to the real visitor; safe to trust behind it only.
      - TRUST_PROXY_HEADERS=true
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://127.0.0.1:8000}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@example.com}
      - CHECKIN_TOKEN_SECRET=${CHECKIN_TOKEN_SECRET:-}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL:-no-reply@example.com}
      - BREVO_SENDER_NAME=${BREVO_SENDER_NAME:-Solus Vires}
      - CHECKIN_ALERT_CHECK_SECONDS=${CHECKIN_ALERT_CHECK_SECONDS:-300}
      - CHECKIN_ALERT_REPEAT_HOURS=${CHECKIN_ALERT_REPEAT_HOURS:-6}
    expose:
      - "8000"
    volumes:
      - ./backend/app:/backend/app

  db:
    image: postgres:16-alpine
    container_name: solusvires_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=solusvires
      - POSTGRES_USER=solusvires
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    volumes:
      - db_data:/var/lib/postgresql/data
    expose:
      - "5432"
    ports:
      # Loopback-only, on a non-default port so it never collides with a
      # locally-installed Postgres and is never reachable off this machine
      # even if this compose file is run on a public host. Lets a local
      # (non-Docker) `uvicorn` dev server share this exact database instead
      # of silently talking to a different, unmigrated Postgres on :5432.
      - "127.0.0.1:5433:5432"

volumes:
  db_data:
