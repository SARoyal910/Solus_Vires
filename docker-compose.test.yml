# Throwaway test stack. Always run through scripts/test.sh, which uses its own
# compose project name so it can never touch the live containers or the
# db_data volume. The database lives in tmpfs and vanishes when stopped.
services:
  db-test:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=solusvires_test
      - POSTGRES_USER=solusvires
      - POSTGRES_PASSWORD=test-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solusvires -d solusvires_test"]
      interval: 1s
      timeout: 3s
      retries: 30

  tests:
    image: python:3.12-slim
    working_dir: /backend
    depends_on:
      db-test:
        condition: service_healthy
    environment:
      - TEST_DATABASE_URL=postgresql+psycopg://solusvires:test-only@db-test:5432/solusvires_test
      - PIP_DISABLE_PIP_VERSION_CHECK=1
      - PIP_ROOT_USER_ACTION=ignore
    volumes:
      - ./backend:/backend
      - pip_cache:/root/.cache/pip
    command: sh -c "pip install -q -r requirements-dev.txt && ruff check . && pytest -p no:cacheprovider $${PYTEST_ARGS:-}"

  # Local preview of this branch: the site + API with a throwaway database.
  # Started by scripts/preview.sh under its own compose project, so test runs
  # (which tear down theirs) leave it alone. Never touches the live stack.
  preview:
    image: python:3.12-slim
    working_dir: /backend
    depends_on:
      db-test:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg://solusvires:test-only@db-test:5432/solusvires_test
      - SITE_DIR=/site
      - CHECKIN_TOKEN_SECRET=preview-only
      - BETA_SIGNUPS_ENABLED=true
      - PUBLIC_BASE_URL=http://127.0.0.1:8099
      - PIP_DISABLE_PIP_VERSION_CHECK=1
      - PIP_ROOT_USER_ACTION=ignore
    volumes:
      - ./backend:/backend
      - ./html:/site:ro
      - pip_cache:/root/.cache/pip
    ports:
      - "127.0.0.1:8099:8000"
    command: sh -c "pip install -q -r requirements.txt && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pip_cache:
