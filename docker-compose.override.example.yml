# Local development only. Copy it into place on your own machine:
#   cp docker-compose.override.example.yml docker-compose.override.yml
# Docker Compose loads docker-compose.override.yml automatically, on top of
# docker-compose.yml. That file is gitignored, so the source bind mount and
# auto-reload below can never reach the droplet. Production runs the code
# baked into the image (engineering review M8).
#
# Migrations still don't run on start, here or anywhere: run
# scripts/migrate.sh after pulling a change that adds one.
services:
  api:
    volumes:
      - ./backend/app:/backend/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log", "--reload"]
