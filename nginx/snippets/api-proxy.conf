# Proxy settings shared by every /api/ location (default.conf).
#
# The upstream is named through a variable on purpose. With a literal
# `proxy_pass http://api:8000`, nginx resolves the name once at startup and
# keeps the address for life; when a deploy recreates the api container, or
# another container (the alert-worker, 2026-10-07) is handed the api's old
# address, every /api/ request 502s until nginx is reloaded. A variable makes
# nginx ask Docker's DNS (127.0.0.11) again, at most every 10 s.
resolver           127.0.0.11 valid=10s ipv6=off;
set                $api_upstream http://api:8000;
proxy_pass         $api_upstream;
proxy_http_version 1.1;
proxy_set_header   Host $host;
proxy_set_header   X-Real-IP $remote_addr;
proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $scheme;

# The app sets some of the same headers for when it runs without
# nginx; hide its copies so each header is sent exactly once.
proxy_hide_header  X-Frame-Options;
proxy_hide_header  X-Content-Type-Options;
proxy_hide_header  Referrer-Policy;
