# Security headers for every response.
#
# nginx quirk: any add_header inside a location block REPLACES every
# add_header inherited from the server block rather than adding to it. So this
# file is included at server level AND in every location that sets its own
# add_header. Forgetting that left account/log/checkin pages with no security
# headers at all (engineering review H2). scripts/probe_headers.sh checks it.

add_header X-Frame-Options SAMEORIGIN always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Strict-Transport-Security "max-age=31536000" always;

# PRE-LAUNCH ONLY: keeps this out of search results while it's live for
# technical testing but hasn't had legal/advocacy review yet. robots.txt
# asks well-behaved crawlers not to visit at all; this header additionally
# blocks indexing even if a URL is discovered another way (e.g. shared
# directly). Remove this one line when ready for a real public launch (P2-B10).
add_header X-Robots-Tag "noindex, nofollow" always;
