# Security headers for every response.
#
# nginx quirk: any add_header inside a location block REPLACES every
# add_header inherited from the server block rather than adding to it. So this
# file is included at server level AND in every location that sets its own
# add_header. Forgetting that left account/log/checkin pages with no security
# headers at all (engineering review H2). scripts/probe_headers.sh checks it.

add_header X-Frame-Options SAMEORIGIN always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Strict-Transport-Security "max-age=31536000" always;

# PRE-LAUNCH ONLY: keeps this out of search results while it's live for
# technical testing but hasn't had legal/advocacy review yet. robots.txt
# asks well-behaved crawlers not to visit at all; this header additionally
# blocks indexing even if a URL is discovered another way (e.g. shared
# directly). Remove this one line when ready for a real public launch (P2-B10).
add_header X-Robots-Tag "noindex, nofollow" always;

# Content-Security-Policy (P2-A4). Only this site's own files may run, style,
# or load: no inline <script>, no style="" attributes, no on* handlers, no
# third-party anything. That also blocks anything injected on the way to the
# browser, like the Cloudflare analytics beacon that once appeared on every
# page (P2-D11). img-src allows data: (the background texture in shared.css)
# and blob: (photos decrypted in the browser on the notes page).
#
# Enforced, not Report-Only: there is no report endpoint (collecting reports
# would mean logging visitors' page URLs, which the privacy page rules out),
# so Report-Only would only warn in visitors' consoles where nobody sees it.
# Every page was clicked through under this exact policy with zero violations
# (tests/browser/csp_clickthrough.mjs). If a deploy ever breaks a page, the
# fast rollback is to rename the header below to
# Content-Security-Policy-Report-Only and reload nginx.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; worker-src 'self'; manifest-src 'self'; frame-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
