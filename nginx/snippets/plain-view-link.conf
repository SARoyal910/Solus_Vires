# Adds a "Plain view" link to the footer of every page (P2-E4), for visitors
# without JavaScript: it opens the same page under /plain/ (see default.conf).
# With JavaScript, shared.js intercepts the click and switches in place.
# Included in each location that serves HTML; the $sv_* variables are maps
# at the top of conf.d/default.conf.
sub_filter_once on;
sub_filter '<p class="footer-links">' '<p class="footer-links"><a class="theme-link" href="/plain$uri">$sv_plain_label</a> · ';
