# Included from nginx/conf.d/default.conf. Needs Authenticated Origin Pulls,
# "Global" option, on in the Cloudflare dashboard (SSL/TLS > Origin Server);
# without it Cloudflare presents no client certificate and every request fails.
#
# Once on, nginx refuses any TLS connection that didn't come through
# Cloudflare, so nobody can bypass Cloudflare's protections by reaching the
# droplet directly. Defense in depth (PHASE2_PLAN P2-A1b): rate-limit
# spoofing is already prevented by cloudflare-realip.conf trusting only
# Cloudflare's IP ranges.
ssl_client_certificate /etc/nginx/snippets/cloudflare-origin-pull-ca.pem;
ssl_verify_client on;
