# NOT INCLUDED YET. Enable only AFTER turning on Authenticated Origin Pulls
# (zone-level) in the Cloudflare dashboard: SSL/TLS > Origin Server.
# Doing this first takes the site down, because Cloudflare won't yet present
# the client certificate nginx would demand.
#
# Once on, nginx refuses any TLS connection that didn't come through
# Cloudflare, so nobody can reach the origin directly and spoof
# CF-Connecting-IP to dodge rate limits (PHASE2_PLAN P2-A1b).
#
# To enable: add this line inside the 443 server block in
# nginx/conf.d/default.conf, then `docker compose restart web`:
#     include /etc/nginx/snippets/authenticated-origin-pulls.conf;
ssl_client_certificate /etc/nginx/snippets/cloudflare-origin-pull-ca.pem;
ssl_verify_client on;
