# Plain view without JavaScript (P2-E4). Every page is also served under
# /plain/ with the plain-view class on <html>, a neutral tab title, and every
# site link rewritten to stay under /plain/, so the choice carries from page
# to page with no cookie and no script. Labels follow the page language.
map $uri $sv_page_es {
    ~^(/plain)?/es/ 1;
    default         0;
}
map $sv_page_es $sv_plain_label {
    1       "Vista sencilla";
    default "Plain view";
}
map $sv_page_es $sv_normal_label {
    1       "Vista normal";
    default "Normal view";
}
map $sv_page_es $sv_neutral_title {
    1       "Notas";
    default "Notes";
}
map $uri $sv_unplain_uri {
    ~^/plain(?<sv_rest>/.*)$ $sv_rest;
    default                  /;
}

# Redirect everything on HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name solusvires.com www.solusvires.com;

    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name solusvires.com www.solusvires.com;

    root /usr/share/nginx/html;
    index index.html;

    # No access log. It would record every visitor's IP address next to the
    # pages they opened (e.g. /log.html), a record that could expose a survivor
    # if subpoenaed or breached. Errors are still logged (without visitor
    # content). html/privacy.html promises this; keep it off.
    access_log off;

    ssl_certificate     /etc/ssl/solusvires/origin.crt;
    ssl_certificate_key /etc/ssl/solusvires/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    include /etc/nginx/snippets/security-headers.conf;

    # Real visitor IP for rate limiting (engineering review H1). Only
    # connections from Cloudflare's own ranges may set it, so a direct
    # connection to the droplet can't spoof CF-Connecting-IP.
    include /etc/nginx/snippets/cloudflare-realip.conf;

    # Refuse TLS connections that don't present Cloudflare's origin-pull client
    # certificate, so the droplet only answers Cloudflare (P2-A1b). Requires
    # Authenticated Origin Pulls > Global to be on in the Cloudflare dashboard
    # (turned on 2026-09-26). If the site ever returns errors after a
    # Cloudflare change, removing this line and restarting nginx undoes it.
    include /etc/nginx/snippets/authenticated-origin-pulls.conf;

    # Static pages. "no-cache" makes browsers check for a newer copy on every
    # visit (a cheap 304 when nothing changed), so nobody is shown an outdated
    # phone number or page from a stale cache. add_header here replaces the
    # server-level headers, hence the include.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/plain-view-link.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # The no-JS plain view (P2-E4; maps at the top of this file). Same files,
    # rewritten on the way out. no-store throughout, like the private pages,
    # since this copy includes them.
    location ^~ /plain/ {
        alias /usr/share/nginx/html/;
        index index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        sub_filter_once off;
        sub_filter '<html lang="en">' '<html lang="en" class="theme-plain">';
        sub_filter '<html lang="es">' '<html lang="es" class="theme-plain">';
        sub_filter '<title>' '<title>$sv_neutral_title</title><template class="sv-title">';
        sub_filter '</title>' '</template>';
        sub_filter 'href="/' 'href="/plain/';
        sub_filter '<p class="footer-links">' '<p class="footer-links"><a class="theme-link" href="$sv_unplain_uri">$sv_normal_label</a> · ';
    }

    # Account, notes, and check-in pages hold session-dependent or private
    # state and must never be served from browser or shared-cache history -
    # mirrors the no-store list in backend/app/core/middleware.py, which only
    # applies to requests that actually reach FastAPI, not these static files.
    location ~ ^/(account|log|checkin|checkin-invite)\.html$ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/plain-view-link.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Backend API (proxied to FastAPI)
    location /api/ {
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Encrypted photo uploads (P2-E7): up to 5 MB of ciphertext, base64 in
    # JSON, so about 7 MB of request. Everything else keeps nginx's 1 MB cap.
    location = /api/evidence/attachments {
        client_max_body_size 8m;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # PIN change (P3-J2): each re-encrypted photo is staged with its own
    # request (same cap as an upload), then one request carries every
    # re-encrypted note, the profile, the plan and the photos' descriptions.
    location ~ ^/api/evidence/attachments/[0-9a-f-]+/rekey$ {
        client_max_body_size 8m;
        include /etc/nginx/snippets/api-proxy.conf;
    }
    location = /api/evidence/rekey {
        client_max_body_size 16m;
        include /etc/nginx/snippets/api-proxy.conf;
    }
}
