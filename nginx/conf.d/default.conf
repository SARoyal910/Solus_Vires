# Redirect everything on HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name solusvires.com www.solusvires.com;

    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name solusvires.com www.solusvires.com;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/ssl/solusvires/origin.crt;
    ssl_certificate_key /etc/ssl/solusvires/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    include /etc/nginx/snippets/security-headers.conf;

    # Real visitor IP for rate limiting (engineering review H1).
    include /etc/nginx/snippets/cloudflare-realip.conf;
    # Docker Desktop on macOS NATs every inbound connection, so nginx sees
    # 192.168.65.1 (its VM gateway) for ALL traffic, Cloudflare's included, and
    # has to trust CF-Connecting-IP from it too. Caveat: someone who connects to
    # the origin IP directly, bypassing Cloudflare, can then spoof that header.
    # Closing that needs Cloudflare Authenticated Origin Pulls (P2-A1b).
    set_real_ip_from 192.168.65.1;

    # Static pages
    location / {
        try_files $uri $uri/ =404;
    }

    # Account, notes, and check-in pages hold session-dependent or private
    # state and must never be served from browser or shared-cache history -
    # mirrors the no-store list in backend/app/core/middleware.py, which only
    # applies to requests that actually reach FastAPI, not these static files.
    location ~ ^/(account|log|checkin|checkin-invite)\.html$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Backend API (proxied to FastAPI)
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # The app sets some of the same headers for when it runs without
        # nginx; hide its copies so each header is sent exactly once.
        proxy_hide_header  X-Frame-Options;
        proxy_hide_header  X-Content-Type-Options;
        proxy_hide_header  Referrer-Policy;
    }
}
