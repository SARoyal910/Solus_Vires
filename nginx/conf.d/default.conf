# Redirect everything on HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name solusvires.com www.solusvires.com;

    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name solusvires.com www.solusvires.com;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/ssl/solusvires/origin.crt;
    ssl_certificate_key /etc/ssl/solusvires/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security-ish headers (basic set)
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Static pages
    location / {
        try_files $uri $uri/ =404;
    }

    # Backend API (proxied to FastAPI)
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
